# AutoBank Database Configuration
# Update these values to match your MySQL setup
db.url=jdbc:mysql://localhost:3306/autobank
db.user=root
db.password=topg

# Backup Configuration
# Directory: leave blank to use ~/AutoBank/backups (recommended)
backup.dir=
# How many backup copies to keep before rotating old ones
backup.retain=10
# Daily auto-backup time in HH:mm format (24h)
backup.schedule=22:00
